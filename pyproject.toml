[project]
name = "omnimissense"
version = "0.4.0"
description = "Score missense variants in any species with protein language models, straight from a VCF."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "bioinformatics",
    "variant-effect-prediction",
    "missense",
    "protein-language-model",
    "esm",
    "vcf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2",
    "pyarrow>=20",
    "pysam>=0.24.1,<0.25",  # bundles bcftools 1.24: csq tables and --dump-gff format
    "torch>=2.6",
    "tqdm>=4.66",
    "transformers>=4.56",
    "typer>=0.29",
]

[project.urls]
Homepage = "https://github.com/dsmear/omnimissense"
Repository = "https://github.com/dsmear/omnimissense"
Issues = "https://github.com/dsmear/omnimissense/issues"

[project.scripts]
omnimissense = "omnimissense.cli:app"

[dependency-groups]
benchmarks = [
    "biopython>=1.84",
]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.2",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not gpu"]
markers = [
    "gpu: test needs a CUDA GPU (skipped in CI)",
    "slow: test downloads models or large data",
]
