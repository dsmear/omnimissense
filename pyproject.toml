[project]
name = "omnimissense"
version = "0.0.1"
description = "Score missense variants in any species with protein language models, straight from a VCF."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "bioinformatics",
    "variant-effect-prediction",
    "missense",
    "protein-language-model",
    "esm",
    "vcf",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.29",
]

[project.scripts]
omnimissense = "omnimissense.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.2",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "gpu: test needs a CUDA GPU (skipped in CI)",
    "slow: test downloads models or large data",
]
